name: Sync skills.sh edition sources
on:
  workflow_call:
    secrets:
      SKILLS_DEPLOY_KEY_ZH:
        required: false
      SKILLS_DEPLOY_KEY_EN:
        required: false
permissions:
  contents: read
jobs:
  edition:
    if: github.repository == 'songzhuozhu/PeterFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: zh
            key: SKILLS_DEPLOY_KEY_ZH
          - lang: en
            key: SKILLS_DEPLOY_KEY_EN
    concurrency:
      group: skills-sh-peterflow-${{ matrix.lang }}
      queue: max
    env:
      EDITION: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push the language source
        id: source
        env:
          DEPLOY_KEY: ${{ secrets[matrix.key] }}
        shell: bash
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded commit $GITHUB_SHA (main is $head)."
            exit 0
          fi
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo 'Mirror write access is not configured. Checking the existing public revision.'
            remote="https://github.com/$GITHUB_REPOSITORY_OWNER/PeterFlow-$EDITION.git"
            bash scripts/sync-skill-source.sh "$EDITION" "$GITHUB_SHA" "$remote" --check >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/edition-key"
          hosts="$RUNNER_TEMP/edition-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          curl --fail --silent --show-error --retry 3 https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$hosts' -i '$key'"
          remote="git@github.com:$GITHUB_REPOSITORY_OWNER/PeterFlow-$EDITION.git"
          bash scripts/sync-skill-source.sh "$EDITION" "$GITHUB_SHA" "$remote" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.source.outputs.revision != ''
        with:
          node-version: 24
      - name: Verify individual installs from the edition repository
        if: steps.source.outputs.revision != ''
        env:
          PREVIOUS: ${{ steps.source.outputs.previous }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then PREVIOUS=; fi
          if [[ "$PREVIOUS" == "$REVISION" ]]; then exit 0; fi
          npm install --prefix "$RUNNER_TEMP/skills-cli" --ignore-scripts --no-audit --no-fund skills@1.9.0
          source_url="https://github.com/$GITHUB_REPOSITORY_OWNER/PeterFlow-$EDITION/tree/$REVISION"
          PATH="$RUNNER_TEMP/skills-cli/node_modules/.bin:$PATH" node scripts/check-skills-sh.mjs "$EDITION" "$source_url" "$PREVIOUS" "$REVISION"
